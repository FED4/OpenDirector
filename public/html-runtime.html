<!doctype html>
<html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HTML runtime</title></head><body>
<script>
(() => {
  'use strict';
  let initialized = false;
  window.addEventListener('message', function initialize(event) {
    if (initialized || event.source !== parent || event.data?.type !== 'opendirector.init' || event.ports.length !== 1) return;
    initialized = true;
    const port = event.ports[0];
    const pending = new Map();
    let sequence = 0;
    const state = event.data.state;
    const api = Object.freeze({
      ready: Promise.resolve(state),
      request(message) {
        if (pending.size >= 8) return Promise.reject(new Error('Too many pending actions'));
        const requestId = String(++sequence);
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pending.delete(requestId);
            reject(new Error('Action review timed out'));
          }, 120000);
          pending.set(requestId, { resolve, reject, timer });
          try {
            port.postMessage({ type: 'opendirector.action', version: 1, requestId,
              action: message.action, payload: message.payload });
          } catch (error) {
            clearTimeout(timer); pending.delete(requestId); reject(error);
          }
        });
      }
    });
    port.onmessage = ({data}) => {
      const item = pending.get(data?.requestId);
      if (!item) return;
      pending.delete(data.requestId); clearTimeout(item.timer);
      if (data.ok) item.resolve(data.result);
      else item.reject(new Error(data.error));
    };
    port.start();
    Object.defineProperty(window, 'opendirector', {value: api, writable: false, configurable: false});
    const policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'";
    // Parse inertly before installation. Runtime privileges come from the host,
    // never from markup supplied by the model.
    const parsed = new DOMParser().parseFromString(String(event.data.html), 'text/html');
    parsed.querySelectorAll('meta,base,iframe,frame,frameset,object,embed,link,script[src]').forEach(node => node.remove());
    parsed.querySelectorAll('a,area').forEach(node => { node.removeAttribute('href'); node.removeAttribute('target'); });
    const output = '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="' + policy + '">' + parsed.head.innerHTML + '</head><body>' + parsed.body.innerHTML + '</body></html>';
    document.open(); document.write(output); document.close();
    queueMicrotask(() => {
      document.documentElement.dataset.opendirectorReady = 'true';
      port.postMessage({type: 'opendirector.ready', version: 1});
    });
  });
})();
</script>
</body></html>
